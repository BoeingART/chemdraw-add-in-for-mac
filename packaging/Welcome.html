<!doctype html><html><meta charset="utf-8"><body style="font:14px -apple-system;padding:16px"><h1>ChemOffice for Mac</h1><p>Version 1.0.6 · Apple Silicon + Intel · macOS 12 or later</p><p>支持快捷键、右键“粘贴”和面板按钮插入可编辑 ChemDraw 结构。编辑中的绘图可复制为独立副本。</p><p>安装后自动打开“完成安装”窗口，引导你确认 Office 文件访问和辅助功能授权。程序会自动配置加载项、验证目录读写并启动粘贴助手。</p><p>升级前请完成当前绘图编辑并退出 ChemOffice。</p></body></html>
