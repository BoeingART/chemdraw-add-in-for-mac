<h1>ChemDraw Add-in for Mac</h1>
<p>Version 1.3.3 · Apple Silicon + Intel · macOS 12或更新</p>
<p>关闭原Office文档时，自动保留草稿并关闭对应ChemDraw编辑窗口，修复窗口无法关闭及插件界面反复弹出的问题。</p>
<p>恢复Word、PowerPoint文件访问授权。</p>
<p>安装后自动打开“设置加载项”，按系统提示允许Office文件访问，完成四项检查后即可使用。</p>
<p>辅助功能、自动化设置和已有绘图、证书及恢复草稿继续保留。</p>
<p>升级前请完成当前编辑并退出应用。</p>
