<h1>ChemDraw Add-in for Mac</h1>
<p>版本1.3.4 · Apple Silicon + Intel · macOS 12或更新</p>
<p>界面根据系统首选语言显示中文或英文，覆盖应用窗口、Office面板、功能区及安装提示。</p>
<p>更改系统首选语言后，请从菜单栏退出应用，再重新打开应用和Office以切换界面语言。</p>
<p>安装后自动打开“设置加载项”，按系统提示允许Office文件访问，完成四项检查后即可使用。</p>
<p>已有绘图、连接证书及恢复草稿继续保留。从旧版升级时，按系统提示确认辅助功能和自动化授权。</p>
<p>升级前请完成当前编辑并退出应用。</p>
</body></html>
