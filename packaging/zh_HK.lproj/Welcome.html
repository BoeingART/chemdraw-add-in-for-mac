<h1>ChemDraw Add-in for Mac</h1>
<p>2.0.1-beta · Apple Silicon + Intel · macOS 12 或更新</p>
<p>修复 PowerPoint 粘贴相同 ChemDraw 对象后无法编辑的问题。每个副本可单独打开和保存。</p>
<p>升级到此测试版时，请从 GitHub 下载 DMG 并替换 Applications 中的应用。</p>
<p>安装后自动打开“设置加载项”，按系统提示允许Office文件访问，完成五项检查后即可使用。</p>
<p>已有绘图、连接证书及恢复草稿继续保留。从旧版升级时，按系统提示确认辅助功能和自动化授权。</p>
<p>升级前请完成当前编辑并退出应用。</p>
