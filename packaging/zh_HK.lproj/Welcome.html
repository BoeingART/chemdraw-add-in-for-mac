<h1>ChemDraw Add-in for Mac</h1>
<p>版本1.5.0 · Apple Silicon + Intel · macOS 12或更新</p>
<p>修复保存和关闭时额外ChemDraw窗口闪现的问题，保留矢量图和可编辑结构。</p>
<p>移除指针旁转圈提示，减少打开时的重复检查，关闭已同步内容时跳过重复回写。</p>
<p>安装后自动打开“设置加载项”，按系统提示允许Office文件访问，完成五项检查后即可使用。</p>
<p>已有绘图、连接证书及恢复草稿继续保留。从旧版升级时，按系统提示确认辅助功能和自动化授权。</p>
<p>升级前请完成当前编辑并退出应用。</p>
