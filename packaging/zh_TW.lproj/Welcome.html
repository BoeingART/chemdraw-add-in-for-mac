<h1>ChemDraw Add-in for Mac</h1>
<p>版本1.5.4 · Apple Silicon + Intel · macOS 12或更新</p>
<p>ChemDraw 26在后台生成预览，保存和关闭回写时不再弹出临时绘图窗口；粘贴预览按实际内容裁切。</p>
<p>升级时选择“检查更新”，确认后自动下载、替换并重新打开应用。</p>
<p>安装后自动打开“设置加载项”，按系统提示允许Office文件访问，完成五项检查后即可使用。</p>
<p>已有绘图、连接证书及恢复草稿继续保留。从旧版升级时，按系统提示确认辅助功能和自动化授权。</p>
<p>升级前请完成当前编辑并退出应用。</p>
