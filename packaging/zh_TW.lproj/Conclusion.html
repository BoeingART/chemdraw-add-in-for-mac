<h1>完成ChemDraw Add-in for Mac安装</h1>
<p>应用将自动打开“设置加载项”，分别检查Word文件访问、PowerPoint文件访问、辅助功能和粘贴助手。</p>
<p>请在系统提示中允许访问所用的Word／PowerPoint／Excel。程序会自动验证目录读写并启动助手，五项检查通过后点击“完成”。</p>
<p>从旧版升级时，按系统提示确认辅助功能和自动化授权。</p>
<p>文件访问被拒绝时，点击“重新授权文件访问”或主界面的“修复加载项”，按提示允许后程序会自动继续。</p>
<p>后续升级在应用内检查更新并确认即可完成。</p>
<p>结构保存后，ChemDraw编辑窗口保持打开；Office文档由你决定何时保存。</p>
</body></html>
