<h1>完成ChemDraw Add-in for Mac安装</h1>
<p>应用将自动打开“设置加载项”，分别检查Word文件访问、PowerPoint文件访问、辅助功能和粘贴助手。</p>
<p>按窗口按钮打开系统设置，启用所用Office应用的文件访问和辅助功能。授权后会自动继续配置，四项检查通过后点击“完成”。</p>
<p>应用默认在右上角菜单栏运行。点击白色轮廓图标选择“打开界面”，可设置加载项、检查更新、修复加载项和设置开机启动。</p>
<p>在ChemDraw中复制结构，到Word或PowerPoint按⌘V或右键选择“粘贴”；双击继续编辑，用⌘W将修改带回原文档。</p>
</body></html>
